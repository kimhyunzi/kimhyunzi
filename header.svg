<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&amp;family=DM+Sans:wght@200;300;400&amp;display=swap');

      /* grid lines fade in */
      .grid-h, .grid-v {
        stroke: #888;
        stroke-width: 0.4;
        opacity: 0;
        animation: gridFade 1.2s ease 0.1s forwards;
      }
      @keyframes gridFade {
        to { opacity: 0.12; }
      }

      /* scan line */
      .scan {
        animation: scanMove 3.5s ease-in-out 0.5s infinite;
        opacity: 0;
      }
      @keyframes scanMove {
        0%   { transform: translateY(0px);   opacity: 0; }
        5%   { opacity: 0.5; }
        90%  { opacity: 0.5; }
        100% { transform: translateY(200px); opacity: 0; }
      }

      /* label fade up */
      .pre-label {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        font-weight: 300;
        fill: #888;
        letter-spacing: 0.14em;
        opacity: 0;
        animation: fadeUp 0.6s ease 0.2s forwards;
      }

      /* name reveal */
      .name-clip rect {
        animation: clipReveal 1s cubic-bezier(0.77,0,0.18,1) 0.4s forwards;
      }
      @keyframes clipReveal {
        from { width: 0; }
        to   { width: 440; }
      }
      .name-text {
        font-family: 'DM Mono', monospace;
        font-size: 38px;
        font-weight: 300;
        fill: #1a1a1a;
        letter-spacing: -0.02em;
      }

      /* cursor blink */
      .cursor {
        opacity: 0;
        animation: cursorAppear 0s 1.35s forwards, blink 1.1s step-end 1.35s infinite;
      }
      @keyframes cursorAppear { to { opacity: 1; } }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }

      /* role pill */
      .role-pill {
        opacity: 0;
        animation: fadeUp 0.5s ease 1.1s forwards;
      }
      .role-label {
        font-family: 'DM Mono', monospace;
        font-size: 10.5px;
        font-weight: 400;
        fill: #666;
        letter-spacing: 0.07em;
      }

      /* tagline */
      .tagline {
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 300;
        fill: #555;
        line-height: 1.7;
      }
      .tagline-1 { opacity: 0; animation: fadeUp 0.5s ease 1.4s forwards; }
      .tagline-2 { opacity: 0; animation: fadeUp 0.5s ease 1.6s forwards; }

      /* coords */
      .coords {
        font-family: 'DM Mono', monospace;
        font-size: 9px;
        font-weight: 300;
        fill: #aaa;
        letter-spacing: 0.08em;
        opacity: 0;
        animation: fadeUp 0.5s ease 2s forwards;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(5px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* dark mode */
      @media (prefers-color-scheme: dark) {
        .name-text { fill: #f0f0f0; }
        .grid-h, .grid-v { stroke: #ccc; }
        .scan line { stroke: #ccc; }
        .tagline { fill: #aaa; }
        .pre-label { fill: #666; }
        .role-label { fill: #888; }
        .role-rect { stroke: #444; }
        .cursor-rect { fill: #f0f0f0; }
        .coords { fill: #555; }
      }
    </style>

    <clipPath id="nameClip">
      <rect class="name-clip-rect" x="40" y="60" width="0" height="60">
        <animate attributeName="width" from="0" to="500" dur="1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.77 0 0.18 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Grid horizontals -->
  <line class="grid-h" x1="0" y1="40"  x2="800" y2="40"/>
  <line class="grid-h" x1="0" y1="80"  x2="800" y2="80"/>
  <line class="grid-h" x1="0" y1="120" x2="800" y2="120"/>
  <line class="grid-h" x1="0" y1="160" x2="800" y2="160"/>

  <!-- Grid verticals -->
  <line class="grid-v" x1="160" y1="0" x2="160" y2="200"/>
  <line class="grid-v" x1="320" y1="0" x2="320" y2="200"/>
  <line class="grid-v" x1="480" y1="0" x2="480" y2="200"/>
  <line class="grid-v" x1="640" y1="0" x2="640" y2="200"/>

  <!-- Scan line -->
  <g class="scan">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#888" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- Pre-label -->
  <text class="pre-label" x="40" y="54">ROBOTICS ENGINEER</text>

  <!-- Name (clipped reveal) -->
  <g clip-path="url(#nameClip)">
    <text class="name-text" x="40" y="108">your.name</text>
  </g>

  <!-- Cursor -->
  <rect class="cursor cursor-rect" x="280" y="76" width="2" height="34" fill="#1a1a1a"/>

  <!-- Role pill -->
  <g class="role-pill">
    <rect class="role-rect" x="40" y="120" width="248" height="20" rx="10" fill="none" stroke="#ccc" stroke-width="0.5"/>
    <circle cx="55" cy="130" r="3" fill="#888"/>
    <text class="role-label" x="65" y="134">computer vision · ai · robotics</text>
  </g>

  <!-- Tagline -->
  <text class="tagline tagline-1" x="40" y="163">I study robotics — teaching machines to</text>
  <text class="tagline tagline-2" x="40" y="180">
    <tspan font-weight="400" fill="#222">see</tspan>
    <tspan>, think, and occasionally —</tspan>
    <tspan font-weight="400" fill="#222"> move.</tspan>
  </text>

  <!-- Coords -->
  <text class="coords" x="760" y="190" text-anchor="end">37.5665°N · 126.9780°E</text>
</svg>
