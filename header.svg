<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&amp;display=swap');

      .pre-label {
        font-family: 'DM Mono', monospace;
        font-size: 13px;
        font-weight: 300;
        fill: #888;
        letter-spacing: 0.16em;
        animation: fadeUp 0.7s ease 0.1s both;
      }
      .name-text {
        font-family: 'DM Mono', monospace;
        font-size: 62px;
        font-weight: 300;
        fill: #1a1a1a;
        letter-spacing: -0.02em;
        animation: fadeUp 0.8s ease 0.3s both;
      }
      .role-pill {
        animation: fadeUp 0.7s ease 0.7s both;
      }
      .role-label {
        font-family: 'DM Mono', monospace;
        font-size: 13px;
        fill: #666;
        letter-spacing: 0.07em;
      }
      .tagline {
        font-family: 'DM Mono', monospace;
        font-size: 15px;
        font-weight: 300;
        fill: #777;
        animation: fadeUp 0.7s ease 1s both;
      }
      .tagline2 {
        font-family: 'DM Mono', monospace;
        font-size: 15px;
        font-weight: 300;
        fill: #777;
        animation: fadeUp 0.7s ease 1.2s both;
      }
      .coords {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        fill: #bbb;
        letter-spacing: 0.08em;
        animation: fadeUp 0.7s ease 1.5s both;
      }
      .scan-line {
        animation: scan 4s ease-in-out 0.3s infinite;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes scan {
        0%   { transform: translateY(0);    opacity: 0; }
        5%   { opacity: 0.4; }
        92%  { opacity: 0.4; }
        100% { transform: translateY(280px); opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }
      .cursor {
        animation: fadeUp 0s 1.1s both, blink 1s step-end 1.1s infinite;
      }

      @media (prefers-color-scheme: dark) {
        .name-text  { fill: #efefef; }
        .pre-label  { fill: #555; }
        .role-label { fill: #777; }
        .role-rect  { stroke: #3a3a3a; }
        .tagline, .tagline2 { fill: #666; }
        .coords     { fill: #444; }
        .cursor     { fill: #efefef; }
        .scan-line  { stroke: #fff; }
      }
    </style>
  </defs>

  <!-- Scan line -->
  <line class="scan-line" x1="0" y1="0" x2="800" y2="0" stroke="#aaa" stroke-width="0.8" opacity="0.4"/>

  <!-- Pre-label -->
  <text class="pre-label" x="48" y="72">ROBOTICS ENGINEER</text>

  <!-- Name -->
  <text class="name-text" x="44" y="152">kimhyunzi</text>

  <!-- Cursor -->
  <rect class="cursor" x="430" y="102" width="3" height="54" fill="#1a1a1a"/>

  <!-- Role pill -->
  <g class="role-pill">
    <rect class="role-rect" x="44" y="168" width="296" height="26" rx="13" fill="none" stroke="#ddd" stroke-width="0.6"/>
    <circle cx="62" cy="181" r="4" fill="#aaa"/>
    <text class="role-label" x="74" y="185">computer vision · ai · robotics</text>
  </g>

  <!-- Tagline -->
  <text class="tagline" x="44" y="224">I study robotics — teaching machines to</text>
  <text class="tagline2" x="44" y="248">
    <tspan font-weight="400" fill="#333">see</tspan><tspan>, think, and occasionally — </tspan><tspan font-weight="400" fill="#333">move.</tspan>
  </text>

  <!-- Coords -->
  <text class="coords" x="756" y="268" text-anchor="end">37.5665°N · 126.9780°E</text>
</svg>
