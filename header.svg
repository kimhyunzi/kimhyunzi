<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&amp;family=DM+Sans:wght@200;300;400&amp;display=swap');

      .grid-h, .grid-v {
        stroke: #888;
        stroke-width: 0.4;
        opacity: 0;
        animation: gridFade 1.2s ease 0.1s forwards;
      }
      @keyframes gridFade { to { opacity: 0.12; } }

      .scan {
        animation: scanMove 3.5s ease-in-out 0.5s infinite;
        opacity: 0;
      }
      @keyframes scanMove {
        0%   { transform: translateY(0px);   opacity: 0; }
        5%   { opacity: 0.5; }
        90%  { opacity: 0.5; }
        100% { transform: translateY(280px); opacity: 0; }
      }

      .pre-label {
        font-family: 'DM Mono', monospace;
        font-size: 13px;
        font-weight: 300;
        fill: #888;
        letter-spacing: 0.16em;
        opacity: 0;
        animation: fadeUp 0.6s ease 0.2s forwards;
      }

      .name-text {
        font-family: 'DM Mono', monospace;
        font-size: 58px;
        font-weight: 300;
        fill: #1a1a1a;
        letter-spacing: -0.02em;
      }

      .cursor {
        opacity: 0;
        animation: cursorAppear 0s 1.35s forwards, blink 1.1s step-end 1.35s infinite;
      }
      @keyframes cursorAppear { to { opacity: 1; } }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }

      .role-pill {
        opacity: 0;
        animation: fadeUp 0.5s ease 1.1s forwards;
      }
      .role-label {
        font-family: 'DM Mono', monospace;
        font-size: 13px;
        font-weight: 400;
        fill: #666;
        letter-spacing: 0.07em;
      }

      .tagline {
        font-family: 'DM Sans', sans-serif;
        font-size: 16px;
        font-weight: 300;
        fill: #555;
      }
      .tagline-1 { opacity: 0; animation: fadeUp 0.5s ease 1.4s forwards; }
      .tagline-2 { opacity: 0; animation: fadeUp 0.5s ease 1.6s forwards; }

      .coords {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        font-weight: 300;
        fill: #aaa;
        letter-spacing: 0.08em;
        opacity: 0;
        animation: fadeUp 0.5s ease 2s forwards;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-color-scheme: dark) {
        .name-text   { fill: #f0f0f0; }
        .grid-h, .grid-v { stroke: #ccc; }
        .tagline     { fill: #aaa; }
        .pre-label   { fill: #666; }
        .role-label  { fill: #888; }
        .role-rect   { stroke: #444; }
        .cursor-rect { fill: #f0f0f0; }
        .coords      { fill: #555; }
      }
    </style>

    <clipPath id="nameClip">
      <rect x="40" y="70" width="0" height="80">
        <animate attributeName="width" from="0" to="700" dur="1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.77 0 0.18 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Grid horizontals -->
  <line class="grid-h" x1="0" y1="56"  x2="800" y2="56"/>
  <line class="grid-h" x1="0" y1="112" x2="800" y2="112"/>
  <line class="grid-h" x1="0" y1="168" x2="800" y2="168"/>
  <line class="grid-h" x1="0" y1="224" x2="800" y2="224"/>

  <!-- Grid verticals -->
  <line class="grid-v" x1="160" y1="0" x2="160" y2="280"/>
  <line class="grid-v" x1="320" y1="0" x2="320" y2="280"/>
  <line class="grid-v" x1="480" y1="0" x2="480" y2="280"/>
  <line class="grid-v" x1="640" y1="0" x2="640" y2="280"/>

  <!-- Scan line -->
  <g class="scan">
    <line x1="0" y1="0" x2="800" y2="0" stroke="#888" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- Pre-label -->
  <text class="pre-label" x="40" y="62">ROBOTICS ENGINEER</text>

  <!-- Name -->
  <g clip-path="url(#nameClip)">
    <text class="name-text" x="40" y="136">kimhyunzi</text>
  </g>

  <!-- Cursor -->
  <rect class="cursor cursor-rect" x="392" y="88" width="3" height="52" fill="#1a1a1a"/>

  <!-- Role pill -->
  <g class="role-pill">
    <rect class="role-rect" x="40" y="152" width="292" height="26" rx="13" fill="none" stroke="#ccc" stroke-width="0.5"/>
    <circle cx="58" cy="165" r="4" fill="#888"/>
    <text class="role-label" x="70" y="169">computer vision · ai · robotics</text>
  </g>

  <!-- Tagline -->
  <text class="tagline tagline-1" x="40" y="210">I study robotics — teaching machines to</text>
  <text class="tagline tagline-2" x="40" y="234">
    <tspan font-weight="400" fill="#222">see</tspan>
    <tspan>, think, and occasionally —</tspan>
    <tspan font-weight="400" fill="#222"> move.</tspan>
  </text>

  <!-- Coords -->
  <text class="coords" x="760" y="268" text-anchor="end">37.5665°N · 126.9780°E</text>
</svg>
